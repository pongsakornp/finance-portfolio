services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy env}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    # loopback-only so local dev tools (drizzle-kit, psql) reach the DB;
    # not reachable from outside the host
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD}@db:5432/finance
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in Dokploy env}
      CRON_ENABLED: ${CRON_ENABLED:-true}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
